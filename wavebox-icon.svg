<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f3a"/>
      <stop offset="1" stop-color="#4a1d8f"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22e5ff"/>
      <stop offset="1" stop-color="#ff4fd8"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4fd8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4fd8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#glow)"/>

  <!-- the "box" -->
  <rect x="66" y="96" width="380" height="320" rx="64" fill="#ffffff" fill-opacity="0.06" stroke="url(#frame)" stroke-width="8"/>

  <!-- the "wave" -->
  <g fill="url(#bar)">
    <rect x="104" y="216" width="30" height="80"  rx="15"/>
    <rect x="148" y="181" width="30" height="150" rx="15"/>
    <rect x="192" y="141" width="30" height="230" rx="15"/>
    <rect x="236" y="171" width="30" height="170" rx="15"/>
    <rect x="280" y="136" width="30" height="240" rx="15"/>
    <rect x="324" y="186" width="30" height="140" rx="15"/>
    <rect x="368" y="221" width="30" height="70"  rx="15"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
